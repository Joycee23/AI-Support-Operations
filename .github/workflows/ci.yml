name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
# Keep push runs: Railway Wait for CI evaluates workflow conclusions.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  frontend:
    name: Frontend build and audit
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm audit --audit-level=high
  backend:
    name: Backend, migrations and tenant isolation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-disposable-password
          POSTGRES_DB: support_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d support_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql+psycopg://ci:ci-only-disposable-password@localhost:5432/support_ci
      DATABASE_MIGRATION_URL: postgresql+psycopg://ci:ci-only-disposable-password@localhost:5432/support_ci
      APP_ENV: test
      SMTP_HOST: ''
      SMTP_USERNAME: ''
      SMTP_PASSWORD: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - run: python -m pip install -r requirements-ops.txt
      - run: python -m pip check
      - run: python scripts/migrate.py
      - run: python scripts/run_checks.py
      - run: python scripts/check_migrations_rls.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ci-test-reports
          path: |
            artifacts/acceptance-route-coverage.json
            artifacts/acceptance-migrations-rls.json
          if-no-files-found: ignore
          retention-days: 7
  security:
    name: Dependency and secret checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit
      - run: pip-audit -r requirements-ops.txt
      - name: Scan Git history for secrets (redacted)
        run: >-
          docker run --rm -v "$PWD:/repo:ro"
          zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --redact --no-banner
  docker:
    name: Docker packaging
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build --tag support-ops:ci .
      - run: docker build --file deploy/railway/Dockerfile --tag support-ops:railway .
      - name: Check Railway image tools and shipped assets
        run: |
          docker run --rm --entrypoint sh support-ops:railway -ec '
            test -f /app/dist/index.html
            test -f /app/dist/assets/brand/support-ops-mark.svg
            python -m pip check
            pg_dump --version
            age --version
          '
