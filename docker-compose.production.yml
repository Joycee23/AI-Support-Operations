# Requires Docker Compose supporting !reset (2.24.4+).
# See SECURITY.md before enabling: development PostgreSQL passwords do not change
# automatically when an existing database volume is reused.
services:
  db:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique production database password}
    restart: unless-stopped
  app:
    ports: !reset []
    restart: unless-stopped
    environment:
      APP_ENV: production
      COOKIE_SECURE: "true"
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?Set the public HTTPS URL}
      CORS_ORIGINS: ${APP_PUBLIC_URL:?Set the public HTTPS URL}
      ALLOWED_HOSTS: ${APP_DOMAIN:?Set the public hostname without https}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?Set and securely back up the encryption key}
      DATABASE_URL: ${DOCKER_DATABASE_URL:?Set the production PostgreSQL URL}
      FORWARDED_ALLOW_IPS: 10.89.0.2
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set the public hostname}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      default:
        ipv4_address: 10.89.0.2
    depends_on: [app]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
networks:
  default:
    ipam:
      config:
        - subnet: 10.89.0.0/24
volumes:
  caddy_data:
  caddy_config:
