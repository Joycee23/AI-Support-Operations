services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: support_ops
      POSTGRES_USER: support
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-support}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - support_ops_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support -d support_ops"]
      interval: 5s
      timeout: 3s
      retries: 15

  migrate:
    build: .
    profiles: [migration]
    command: ["python", "scripts/migrate.py", "--adopt-existing"]
    environment:
      DATABASE_MIGRATION_URL: ${DOCKER_DATABASE_MIGRATION_URL:-}
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 1g
    cpus: 2
    tmpfs:
      - /tmp:size=128m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,[::1]}
      API_IP_PER_MINUTE: ${API_IP_PER_MINUTE:-600}
      API_USER_PER_MINUTE: ${API_USER_PER_MINUTE:-180}
      API_WORKSPACE_PER_MINUTE: ${API_WORKSPACE_PER_MINUTE:-1800}
      API_WRITES_PER_MINUTE: ${API_WRITES_PER_MINUTE:-40}
      AI_USER_PER_MINUTE: ${AI_USER_PER_MINUTE:-5}
      AI_WORKSPACE_PER_MINUTE: ${AI_WORKSPACE_PER_MINUTE:-20}
      AI_WORKSPACE_PER_DAY: ${AI_WORKSPACE_PER_DAY:-300}
      AI_GLOBAL_PER_DAY: ${AI_GLOBAL_PER_DAY:-5000}
      AI_USER_CONCURRENCY: ${AI_USER_CONCURRENCY:-1}
      AI_WORKSPACE_CONCURRENCY: ${AI_WORKSPACE_CONCURRENCY:-3}
      AI_GLOBAL_CONCURRENCY: ${AI_GLOBAL_CONCURRENCY:-12}
      AI_MAX_PROVIDER_ATTEMPTS: ${AI_MAX_PROVIDER_ATTEMPTS:-4}
      INGEST_GLOBAL_CONCURRENCY: ${INGEST_GLOBAL_CONCURRENCY:-3}
      UPLOADS_PER_HOUR: ${UPLOADS_PER_HOUR:-20}
      KNOWLEDGE_WORKSPACE_MAX_ITEMS: ${KNOWLEDGE_WORKSPACE_MAX_ITEMS:-1000}
      UPLOAD_WORKSPACE_BYTES: ${UPLOAD_WORKSPACE_BYTES:-268435456}
      UPLOAD_MIN_FREE_BYTES: ${UPLOAD_MIN_FREE_BYTES:-1073741824}
      EMBEDDING_WORKSPACE_CHUNKS_PER_DAY: ${EMBEDDING_WORKSPACE_CHUNKS_PER_DAY:-2000}
      EMBEDDING_GLOBAL_CHUNKS_PER_DAY: ${EMBEDDING_GLOBAL_CHUNKS_PER_DAY:-20000}
      PORT: 8000
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-AI Support Operations}
      SUBSCRIPTION_MONTHLY_PRICE_VND: ${SUBSCRIPTION_MONTHLY_PRICE_VND:-499000}
      SEPAY_BANK_CODE: ${SEPAY_BANK_CODE:-}
      SEPAY_ACCOUNT_NUMBER: ${SEPAY_ACCOUNT_NUMBER:-}
      SEPAY_ACCOUNT_NAME: ${SEPAY_ACCOUNT_NAME:-}
      SEPAY_WEBHOOK_API_KEY: ${SEPAY_WEBHOOK_API_KEY:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql+psycopg://support:support@db:5432/support_ops}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY in .env before starting}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      NINEROUTER_BASE_URL: ${NINEROUTER_DOCKER_BASE_URL:-http://host.docker.internal:20128/v1}
      NINEROUTER_API_KEY: ${NINEROUTER_API_KEY:-}
      NINEROUTER_MODEL: ${NINEROUTER_MODEL:-codexlite/gpt-6-luna}
      NINEROUTER_FALLBACK_MODELS: ${NINEROUTER_FALLBACK_MODELS-codexlite/gpt-6-sol}
      NINEROUTER_GEMINI_FALLBACK: ${NINEROUTER_GEMINI_FALLBACK:-true}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_FALLBACK_MODELS: ${GEMINI_FALLBACK_MODELS:-gemini-3.6-flash,gemini-3.5-flash,gemini-3.1-flash-lite}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      UPLOAD_DIR: /app/data/uploads
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - support_ops_files:/app/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  support_ops_pg:
  support_ops_files:
